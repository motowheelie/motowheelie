<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>NEON WHEELIE</title>
<style>
html,body{margin:0;height:100%;background:#07010f;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100vw;height:100vh;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const PINK = '#ff2e88', CYAN = '#21f6ff', YEL = '#ffe76a', PURP = '#b14bff', LIME = '#5dff8a', RED = '#ff3b3b';
const FONT = (s) => `italic 900 ${s}px "Arial Black", Impact, sans-serif`;
let W, H, DPR, gy, hy, bx, sun, sunR;

function makeSun() {
  const R = Math.round(Math.min(W, H) * 0.22); sunR = R;
  sun = document.createElement('canvas'); sun.width = sun.height = R * 2;
  const s = sun.getContext('2d');
  const g = s.createLinearGradient(0, 0, 0, R * 2);
  g.addColorStop(0, YEL); g.addColorStop(0.5, '#ff9a3c'); g.addColorStop(1, PINK);
  s.fillStyle = g; s.beginPath(); s.arc(R, R, R, 0, Math.PI * 2); s.fill();
  s.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 8; i++) s.fillRect(0, R * (1.0 + i * 0.12), R * 2, R * (0.012 + i * 0.013));
}
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  hy = H * 0.6; gy = H * 0.8; bx = Math.max(110, W * 0.3);
  makeSun();
}
resize(); addEventListener('resize', resize);

let best = 0; try { best = +localStorage.getItem('neonWheelieBest') || 0; } catch (e) {}

// ---------- state ----------
let mode = 'title', a = 0, av = 0, hold = false, speed = 320, dist = 0, score = 0, mult = 1;
let wheelieTime = 0, shake = 0, crashT = 0, bumpTimer = 2, wheelRot = 0, t = 0, flash = 0;
let crash = null, lastMult = 1;
const parts = [], pops = [], lines = [];
const stars = Array.from({ length: 140 }, () => ({ x: Math.random(), y: Math.random() * 0.6, s: Math.random() * 1.6 + 0.3, p: Math.random() * 6 }));
const WORDS = ['NICE', 'SICK!', 'RADICAL', 'INSANE', 'GODLIKE', 'LEGENDARY', '1000x COOL', 'UNSTOPPABLE', 'BEYOND REALITY'];

function start() {
  mode = 'play'; a = 0; av = 0; speed = 420; dist = 0; score = 0; mult = 1; wheelieTime = 0;
  bumpTimer = 1.5; crash = null; parts.length = 0; pops.length = 0; flash = 0.6;
}

// ---------- audio ----------
let AC = null, o1, o2, filt, gain, muted = false;
function initAudio() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    o1 = AC.createOscillator(); o1.type = 'sawtooth';
    o2 = AC.createOscillator(); o2.type = 'square';
    filt = AC.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 800;
    gain = AC.createGain(); gain.gain.value = 0;
    o1.connect(filt); o2.connect(filt); filt.connect(gain); gain.connect(AC.destination);
    o1.start(); o2.start();
  } catch (e) { AC = null; }
}
function boom() {
  if (!AC || muted) return;
  try {
    const len = AC.sampleRate * 0.8, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const src = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 1200; g.gain.value = 0.5;
    src.buffer = buf; src.connect(f); f.connect(g); g.connect(AC.destination); src.start();
  } catch (e) {}
}
function blip(freq) {
  if (!AC || muted) return;
  try {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(freq, AC.currentTime);
    o.frequency.exponentialRampToValueAtTime(freq * 2, AC.currentTime + 0.15);
    g.gain.setValueAtTime(0.12, AC.currentTime); g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.3);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + 0.3);
  } catch (e) {}
}

// ---------- input ----------
function down(e) {
  if (e && e.preventDefault) e.preventDefault();
  initAudio();
  if (AC && AC.state === 'suspended') AC.resume();
  if (e && e.clientX !== undefined && e.clientX > W - 64 && e.clientY < 64) { muted = !muted; return; }
  if (mode === 'title') start();
  else if (mode === 'crash') { if (crashT > 1.0) start(); else return; }
  hold = true;
}
function up() { hold = false; }
cv.addEventListener('pointerdown', down);
addEventListener('pointerup', up); addEventListener('pointercancel', up); addEventListener('blur', up);
addEventListener('keydown', (e) => {
  if (e.code === 'KeyM') { muted = !muted; return; }
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); if (!e.repeat) down(); }
});
addEventListener('keyup', (e) => { if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') up(); });

// ---------- helpers ----------
const R_W = 24, L_W = 104;
function toWorld(lx, ly, ox, oy, ang) {
  const c = Math.cos(ang), s = Math.sin(ang);
  return [ox + lx * c + ly * s, oy - lx * s + ly * c];
}
function addPart(p) { if (parts.length < 600) parts.push(p); }
function pop(text, color, size) { pops.push({ text, color, size: size || 34, life: 1.4, max: 1.4, y: 0 }); }

function doCrash() {
  mode = 'crash'; crashT = 0; shake = 28; flash = 1;
  crash = { x: bx, y: gy, ang: a, av: 7, vx: -140, vy: -420 };
  for (let i = 0; i < 140; i++) {
    const ang = Math.random() * Math.PI * 2, sp = 100 + Math.random() * 700;
    addPart({ x: bx + 40, y: gy - 50, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 200, life: 1 + Math.random(), max: 2,
      size: 2 + Math.random() * 4, color: [PINK, CYAN, YEL, PURP][i % 4], g: 900, glow: true });
  }
  boom();
  if (score > best) { best = Math.floor(score); try { localStorage.setItem('neonWheelieBest', best); } catch (e) {} }
}

// ---------- update ----------
function update(dt) {
  t += dt;
  if (mode === 'play') {
    speed = Math.min(1150, speed + 14 * dt);
    const T = hold ? 16 : 0, G = 11;
    av += (T - G * Math.cos(a)) * dt;
    av *= Math.pow(0.55, dt);
    a += av * dt;
    if (a < 0) {
      if (av < -2.2) { shake += 6; for (let i = 0; i < 12; i++) addPart({ x: bx + L_W, y: gy, vx: -speed * 0.4 + (Math.random() - 0.5) * 200, vy: -Math.random() * 250, life: 0.5, max: 0.5, size: 2, color: YEL, g: 800, glow: true }); }
      a = 0; av = av < -2.2 ? -av * 0.18 : 0;
    }
    // road bumps
    bumpTimer -= dt;
    if (bumpTimer <= 0) {
      bumpTimer = 0.5 + Math.random() * 1.5;
      if (a > 0.05) av += (Math.random() - 0.45) * 2.4 * (speed / 700);
      shake += 2.5;
    }
    if (a > 1.5) { doCrash(); return; }
    dist += speed * dt;
    const sweet = a > 0.7 && a < 1.25;
    if (a > 0.12) {
      wheelieTime += dt;
      mult = 1 + Math.floor(wheelieTime / 2);
      if (mult > lastMult) { pop(`x${mult} ${WORDS[Math.min(mult - 2, WORDS.length - 1)]}`, mult > 6 ? YEL : mult > 3 ? PINK : CYAN, 30 + Math.min(mult, 10) * 3); blip(300 + mult * 60); flash = 0.25; }
      lastMult = mult;
      score += speed * dt * 0.012 * mult * (sweet ? 2 : 1);
    } else {
      if (wheelieTime > 2.5) { pop(`CLEAN LANDING +${Math.floor(wheelieTime * 25 * mult)}`, LIME, 26); score += wheelieTime * 25 * mult; }
      wheelieTime = 0; mult = 1; lastMult = 1;
    }
    // exhaust flames
    if (hold) for (let i = 0; i < 3; i++) {
      const [ex, ey] = toWorld(-12, -R_W - 20, bx, gy, a);
      addPart({ x: ex, y: ey, vx: -speed * 0.35 - 120 - Math.random() * 120, vy: (Math.random() - 0.5) * 60, life: 0.25, max: 0.25, size: 5 + Math.random() * 5, color: Math.random() < 0.5 ? YEL : '#ff7a2e', glow: true, shrink: true });
    }
    // danger sparks from tail scraping
    if (a > 1.2) for (let i = 0; i < 4; i++) {
      const [sx, sy] = toWorld(-26, -6, bx, gy, a);
      addPart({ x: sx, y: Math.min(sy, gy), vx: -speed * 0.6 - Math.random() * 300, vy: -Math.random() * 300, life: 0.4, max: 0.4, size: 2, color: Math.random() < 0.5 ? YEL : RED, g: 900, glow: true });
    }
  } else if (mode === 'crash') {
    crashT += dt;
    speed *= Math.pow(0.35, dt);
    dist += speed * dt;
    const c = crash;
    c.vy += 1100 * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.ang += c.av * dt;
    if (c.y > gy) { c.y = gy; c.vy = -c.vy * 0.35; c.av *= 0.6; c.vx *= 0.6; shake += 4; }
  } else {
    speed = 320; dist += speed * dt;
    a = Math.max(0, Math.sin(t * 1.3) * 0.25);
  }
  wheelRot += speed * dt / R_W;

  // tire smoke
  if (Math.random() < 0.6) addPart({ x: bx + (mode === 'crash' ? -999 : 0), y: gy - 4, vx: -speed * 0.5 * Math.random(), vy: -Math.random() * 50, life: 0.9, max: 0.9, size: 6, color: 'rgba(190,140,255,', smoke: true });

  // speed lines
  if (Math.random() < speed / 900) lines.push({ x: W + 50, y: Math.random() * gy, len: 80 + Math.random() * 220, w: Math.random() * 2 + 0.5 });
  for (let i = lines.length - 1; i >= 0; i--) { lines[i].x -= speed * 2.6 * dt; if (lines[i].x + lines[i].len < 0) lines.splice(i, 1); }

  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt; if (p.life <= 0) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.g) { p.vy += p.g * dt; if (p.y > gy && p.vy > 0) { p.y = gy; p.vy *= -0.4; p.vx *= 0.7; } }
    if (p.smoke) p.size += 40 * dt;
  }
  for (let i = pops.length - 1; i >= 0; i--) { pops[i].life -= dt; pops[i].y -= 40 * dt; if (pops[i].life <= 0) pops.splice(i, 1); }
  shake *= Math.pow(0.015, dt);
  flash = Math.max(0, flash - dt * 2);

  if (AC) {
    const f = 42 + speed * 0.05 + (hold && mode === 'play' ? 38 : 0) + a * 28;
    const now = AC.currentTime;
    o1.frequency.setTargetAtTime(f, now, 0.06);
    o2.frequency.setTargetAtTime(f * 0.5 + 1.7, now, 0.06);
    filt.frequency.setTargetAtTime(500 + (hold ? 900 : 0) + speed * 0.5, now, 0.08);
    gain.gain.setTargetAtTime(muted ? 0 : mode === 'play' ? 0.05 : mode === 'title' ? 0.02 : 0, now, 0.1);
  }
}

// ---------- drawing ----------
function hash(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

function drawBG() {
  const sky = ctx.createLinearGradient(0, 0, 0, hy);
  sky.addColorStop(0, '#05010f'); sky.addColorStop(0.55, '#2a0650'); sky.addColorStop(1, '#ff2e88');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, hy + 1);

  for (const s of stars) {
    const x = ((s.x * W - dist * 0.01 * s.s) % W + W) % W;
    ctx.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(t * 2 + s.p));
    ctx.fillStyle = '#fff'; ctx.fillRect(x, s.y * H, s.s, s.s);
  }
  ctx.globalAlpha = 1;

  ctx.save(); ctx.shadowColor = PINK; ctx.shadowBlur = 80;
  ctx.drawImage(sun, W * 0.68 - sunR, hy - sunR * 1.45); ctx.restore();

  // far mountains
  const mtn = (off, base, amp, fill, stroke, seed) => {
    ctx.beginPath(); ctx.moveTo(0, hy);
    for (let x = 0; x <= W + 20; x += 16) {
      const X = x + off;
      const h = (Math.abs(Math.sin(X * 0.0035 + seed)) * 0.6 + Math.abs(Math.sin(X * 0.009 + seed * 3)) * 0.3 + Math.sin(X * 0.03) * 0.1) * amp + base;
      ctx.lineTo(x, hy - h);
    }
    ctx.lineTo(W, hy); ctx.closePath();
    ctx.fillStyle = fill; ctx.fill();
    ctx.save(); ctx.shadowColor = stroke; ctx.shadowBlur = 12; ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
  };
  mtn(dist * 0.03, 10, H * 0.17, '#1a0636', PURP, 1);
  mtn(dist * 0.07, 0, H * 0.1, '#12042a', CYAN, 5);

  // city
  const off = dist * 0.18, bw = 54;
  const i0 = Math.floor(off / bw) - 1, i1 = i0 + Math.ceil(W / bw) + 3;
  for (let i = i0; i < i1; i++) {
    const h1 = hash(i), h2 = hash(i + 99);
    if (h2 < 0.25) continue;
    const bh = 20 + h1 * H * 0.15, x = i * bw - off, w = bw - 8 - h2 * 10;
    ctx.fillStyle = '#0c0220'; ctx.fillRect(x, hy - bh, w, bh);
    ctx.fillStyle = h1 > 0.5 ? 'rgba(255,46,136,.7)' : 'rgba(33,246,255,.6)';
    ctx.fillRect(x, hy - bh, w, 2);
    for (let wy = hy - bh + 8; wy < hy - 6; wy += 10) for (let wx = x + 5; wx < x + w - 5; wx += 9)
      if (hash(i * 31 + wx * 0.7 + wy * 1.3) > 0.72) { ctx.fillStyle = hash(wy + i) > 0.5 ? 'rgba(255,231,106,.8)' : 'rgba(33,246,255,.7)'; ctx.fillRect(wx, wy, 3, 4); }
  }

  // floor grid
  const fl = ctx.createLinearGradient(0, hy, 0, H);
  fl.addColorStop(0, '#2a0548'); fl.addColorStop(1, '#05000c');
  ctx.fillStyle = fl; ctx.fillRect(0, hy, W, H - hy);
  ctx.save(); ctx.strokeStyle = PURP; ctx.shadowColor = PURP; ctx.shadowBlur = 8; ctx.lineWidth = 1.2;
  for (let i = 1; i <= 14; i++) {
    const p = i / 14, y = hy + (H - hy) * p * p;
    ctx.globalAlpha = 0.25 + p * 0.5; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  const sp = 90, go = dist % sp;
  ctx.globalAlpha = 0.55;
  for (let xb = -W * 3; xb < W * 4; xb += sp) {
    const x0 = xb - go * 6, xt = W / 2 + (x0 - W / 2) * 0.12;
    ctx.beginPath(); ctx.moveTo(xt, hy); ctx.lineTo(x0, H); ctx.stroke();
  }
  ctx.restore();
  // horizon glow
  const hg = ctx.createLinearGradient(0, hy - 30, 0, hy + 30);
  hg.addColorStop(0, 'rgba(255,46,136,0)'); hg.addColorStop(0.5, 'rgba(255,46,136,.55)'); hg.addColorStop(1, 'rgba(255,46,136,0)');
  ctx.fillStyle = hg; ctx.fillRect(0, hy - 30, W, 60);

  // road
  ctx.fillStyle = 'rgba(5,0,15,.85)'; ctx.fillRect(0, gy, W, 34);
  ctx.save(); ctx.shadowColor = PINK; ctx.shadowBlur = 18; ctx.fillStyle = PINK; ctx.fillRect(0, gy - 1, W, 3);
  ctx.shadowColor = CYAN; ctx.fillStyle = CYAN; ctx.fillRect(0, gy + 33, W, 2);
  ctx.fillStyle = 'rgba(255,231,106,.85)'; ctx.shadowColor = YEL;
  const ds = 80, dof = dist % ds;
  for (let x = -dof; x < W; x += ds) ctx.fillRect(x, gy + 16, 40, 3);
  ctx.restore();
}

function drawBike(ox, oy, ang) {
  const r = R_W, L = L_W;
  ctx.save(); ctx.translate(ox, oy); ctx.rotate(-ang);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  // headlight beam
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const bg = ctx.createLinearGradient(L, 0, L + 320, 0);
  bg.addColorStop(0, 'rgba(255,240,180,.45)'); bg.addColorStop(1, 'rgba(255,240,180,0)');
  ctx.fillStyle = bg; ctx.beginPath(); ctx.moveTo(L - 6, -r - 46); ctx.lineTo(L + 320, -r - 110); ctx.lineTo(L + 320, -r + 30); ctx.closePath(); ctx.fill();
  ctx.restore();

  // wheels
  for (const cx of [0, L]) {
    ctx.save(); ctx.translate(cx, -r);
    ctx.fillStyle = '#0a0014'; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.shadowColor = CYAN; ctx.shadowBlur = 20; ctx.strokeStyle = CYAN; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(0, 0, r - 2, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 1.5; ctx.globalAlpha = 0.8; ctx.beginPath(); ctx.arc(0, 0, r - 9, 0, Math.PI * 2); ctx.stroke();
    ctx.rotate(wheelRot); ctx.strokeStyle = PINK; ctx.shadowColor = PINK;
    for (let i = 0; i < 5; i++) { ctx.rotate(Math.PI * 2 / 5); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(r - 9, 0); ctx.stroke(); }
    ctx.globalAlpha = 1; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  ctx.shadowColor = PINK; ctx.shadowBlur = 14;
  // swingarm & fork
  ctx.strokeStyle = '#d9c8ff'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(38, -r - 16); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(L, -r); ctx.lineTo(L - 18, -r - 60); ctx.stroke();
  // exhaust
  ctx.strokeStyle = '#8a7aa8'; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(42, -r - 10); ctx.lineTo(-10, -r - 20); ctx.stroke();
  ctx.save(); ctx.shadowColor = YEL; ctx.shadowBlur = 20; ctx.fillStyle = YEL; ctx.beginPath(); ctx.arc(-11, -r - 20, 3.5, 0, 7); ctx.fill(); ctx.restore();
  // engine block
  ctx.fillStyle = '#1d0b33'; ctx.fillRect(40, -r - 28, 30, 22);
  ctx.strokeStyle = CYAN; ctx.lineWidth = 1.5; ctx.strokeRect(40, -r - 28, 30, 22);
  // body / tank
  const bodyG = ctx.createLinearGradient(10, -r - 60, 90, -r - 20);
  bodyG.addColorStop(0, PINK); bodyG.addColorStop(1, PURP);
  ctx.fillStyle = bodyG;
  ctx.beginPath();
  ctx.moveTo(-6, -r - 34); ctx.lineTo(20, -r - 40); ctx.lineTo(50, -r - 52); ctx.lineTo(82, -r - 56); ctx.lineTo(L - 10, -r - 62);
  ctx.lineTo(L - 4, -r - 44); ctx.lineTo(L - 22, -r - 30); ctx.lineTo(66, -r - 28); ctx.lineTo(30, -r - 26); ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.7;
  ctx.beginPath(); ctx.moveTo(24, -r - 37); ctx.lineTo(78, -r - 50); ctx.stroke(); ctx.globalAlpha = 1;
  // seat
  ctx.fillStyle = '#0d0418'; ctx.beginPath(); ctx.moveTo(2, -r - 38); ctx.lineTo(48, -r - 50); ctx.lineTo(50, -r - 44); ctx.lineTo(6, -r - 33); ctx.closePath(); ctx.fill();
  // headlight
  ctx.save(); ctx.shadowColor = YEL; ctx.shadowBlur = 25; ctx.fillStyle = '#fff6c8';
  ctx.beginPath(); ctx.ellipse(L - 4, -r - 50, 4, 7, 0, 0, 7); ctx.fill(); ctx.restore();
  // tail light
  ctx.save(); ctx.shadowColor = RED; ctx.shadowBlur = 18; ctx.fillStyle = RED; ctx.fillRect(-9, -r - 38, 6, 4); ctx.restore();
  // handlebar
  ctx.strokeStyle = '#d9c8ff'; ctx.lineWidth = 4; ctx.shadowColor = CYAN; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.moveTo(L - 18, -r - 60); ctx.lineTo(L - 32, -r - 70); ctx.stroke();

  // rider
  const lean = Math.min(ang * 0.55, 0.6);
  const hip = [32, -r - 50];
  const th = -Math.PI / 2 + 0.6 - lean;
  const sh = [hip[0] + 40 * Math.cos(th), hip[1] + 40 * Math.sin(th)];
  const hd = [sh[0] + 15 * Math.cos(th), sh[1] + 15 * Math.sin(th)];
  const grip = [L - 32, -r - 70];
  const knee = [62, -r - 34], foot = [46, -r - 12];
  const limb = (pts, w) => {
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.strokeStyle = '#1a0830'; ctx.lineWidth = w; ctx.shadowBlur = 0; ctx.stroke();
    ctx.strokeStyle = PURP; ctx.lineWidth = 1.6; ctx.shadowColor = PURP; ctx.shadowBlur = 10; ctx.stroke();
  };
  // scarf
  ctx.save(); ctx.strokeStyle = PINK; ctx.shadowColor = PINK; ctx.shadowBlur = 16; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(sh[0], sh[1] - 4);
  for (let i = 1; i <= 6; i++) ctx.lineTo(sh[0] - i * 11, sh[1] - 4 + Math.sin(t * 22 - i * 1.1) * (2 + i * 1.4) + i * 2);
  ctx.stroke(); ctx.restore();
  limb([hip, knee, foot], 10);
  limb([hip, sh], 13);
  limb([sh, [(sh[0] + grip[0]) / 2 + 2, (sh[1] + grip[1]) / 2 + 8], grip], 8);
  // helmet
  ctx.fillStyle = '#12051f'; ctx.shadowColor = CYAN; ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.arc(hd[0], hd[1], 12, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = CYAN; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = CYAN; ctx.beginPath(); ctx.arc(hd[0], hd[1], 12, -0.6 - lean, 0.5 - lean); ctx.lineTo(hd[0] + 2, hd[1]); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawParts() {
  for (const p of parts) {
    const k = p.life / p.max;
    if (p.smoke) { ctx.fillStyle = p.color + (k * 0.25) + ')'; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 7); ctx.fill(); }
  }
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const p of parts) {
    if (p.smoke) continue;
    const k = p.life / p.max;
    ctx.globalAlpha = k; ctx.fillStyle = p.color;
    const s = p.shrink ? p.size * k : p.size;
    ctx.beginPath(); ctx.arc(p.x, p.y, s, 0, 7); ctx.fill();
  }
  ctx.restore();
}

function glowText(txt, x, y, size, color, align) {
  ctx.font = FONT(size); ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = 'rgba(33,246,255,.7)'; ctx.fillText(txt, x - 3, y);
  ctx.fillStyle = 'rgba(255,46,136,.7)'; ctx.fillText(txt, x + 3, y);
  ctx.restore();
  ctx.save(); ctx.shadowColor = color; ctx.shadowBlur = 22; ctx.fillStyle = '#fff'; ctx.fillText(txt, x, y); ctx.restore();
}

function drawGauge() {
  const cx = W - 90, cy = H - 40, R = 62, max = 1.5;
  const ang = (v) => Math.PI + (v / max) * (Math.PI / 2) * 1.0;
  const seg = (a0, a1, col) => { ctx.strokeStyle = col; ctx.shadowColor = col; ctx.beginPath(); ctx.arc(cx, cy, R, ang(a0), ang(a1)); ctx.stroke(); };
  ctx.save(); ctx.lineWidth = 9; ctx.shadowBlur = 14; ctx.globalAlpha = 0.9;
  seg(0, 0.7, CYAN); seg(0.7, 1.25, LIME); seg(1.25, 1.5, RED);
  const na = ang(Math.min(a, max));
  ctx.strokeStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(na) * (R + 8), cy + Math.sin(na) * (R + 8)); ctx.stroke();
  ctx.restore();
  ctx.font = FONT(12); ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.textAlign = 'center';
  ctx.fillText(Math.round(a * 57.3) + '°', cx - 20, cy - 8);
}

function drawHUD() {
  if (mode === 'play' || mode === 'crash') {
    ctx.textAlign = 'left';
    glowText(Math.floor(score).toLocaleString(), 24, 40, 40, PINK, 'left');
    ctx.font = FONT(14); ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.textAlign = 'left';
    ctx.fillText(`BEST ${best.toLocaleString()}   ${Math.floor(dist / 10)} m   ${Math.floor(speed / 6)} km/h`, 26, 74);
    if (mode === 'play' && mult > 1) glowText('x' + mult, 26 + 20, 112, 30 + Math.sin(t * 12) * 2, YEL, 'left');
    if (mode === 'play') {
      if (a > 0.7 && a < 1.25) glowText('SWEET SPOT  x2', W / 2, 90, 18, LIME);
      drawGauge();
    }
  }
  // popups
  for (const p of pops) {
    const k = p.life / p.max, s = p.size * (k > 0.85 ? 1 + (k - 0.85) * 4 : 1);
    ctx.globalAlpha = Math.min(1, k * 2);
    glowText(p.text, W / 2, H * 0.3 + p.y, s, p.color);
    ctx.globalAlpha = 1;
  }
  // mute button
  ctx.save(); ctx.font = '22px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = muted ? 'rgba(255,255,255,.35)' : '#fff'; ctx.fillText(muted ? '🔇' : '🔊', W - 32, 32); ctx.restore();

  if (mode === 'title') {
    ctx.fillStyle = 'rgba(5,0,15,.35)'; ctx.fillRect(0, 0, W, H);
    const sz = Math.min(96, W / 8);
    glowText('NEON', W / 2, H * 0.22, sz, PINK);
    glowText('WHEELIE', W / 2, H * 0.22 + sz * 0.95, sz, CYAN);
    if (Math.sin(t * 5) > -0.3) glowText('CLICK / TAP / SPACE TO RIDE', W / 2, H * 0.22 + sz * 2, Math.min(24, W / 26), YEL);
    ctx.font = FONT(Math.min(15, W / 34)); ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.textAlign = 'center';
    ctx.fillText('HOLD to pop a wheelie · RELEASE to drop the front', W / 2, H * 0.22 + sz * 2.6);
    ctx.fillText('Stay in the green zone for x2 · Too far = WIPEOUT', W / 2, H * 0.22 + sz * 2.6 + 22);
    if (best) ctx.fillText('BEST ' + best.toLocaleString(), W / 2, H * 0.22 + sz * 2.6 + 50);
  }
  if (mode === 'crash' && crashT > 0.5) {
    const k = Math.min(1, (crashT - 0.5) * 3);
    ctx.fillStyle = `rgba(5,0,15,${0.45 * k})`; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = k;
    const sz = Math.min(90, W / 7);
    glowText('WIPEOUT', W / 2 + (Math.random() - 0.5) * 6 * (1 - k), H * 0.3, sz, RED);
    glowText(Math.floor(score).toLocaleString(), W / 2, H * 0.3 + sz, sz * 0.6, PINK);
    if (Math.floor(score) >= best && score > 0) glowText('★ NEW BEST ★', W / 2, H * 0.3 + sz * 1.6, sz * 0.3, YEL);
    else glowText('BEST ' + best.toLocaleString(), W / 2, H * 0.3 + sz * 1.6, sz * 0.28, CYAN);
    if (crashT > 1.0 && Math.sin(t * 5) > -0.3) glowText('CLICK TO RIDE AGAIN', W / 2, H * 0.3 + sz * 2.3, Math.min(24, W / 24), YEL);
    ctx.globalAlpha = 1;
  }
}

function draw() {
  ctx.save();
  if (shake > 0.3) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawBG();
  // speed lines
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const l of lines) {
    const g = ctx.createLinearGradient(l.x, 0, l.x + l.len, 0);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(180,240,255,.45)');
    ctx.fillStyle = g; ctx.fillRect(l.x, l.y, l.len, l.w);
  }
  ctx.restore();
  drawParts();
  if (mode === 'crash') drawBike(crash.x, crash.y, crash.ang);
  else drawBike(bx, gy, a);
  ctx.restore();

  // danger vignette
  if (mode === 'play' && a > 1.15) {
    const k = Math.min(1, (a - 1.15) / 0.35) * (0.6 + 0.4 * Math.sin(t * 25));
    const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
    v.addColorStop(0, 'rgba(255,0,40,0)'); v.addColorStop(1, `rgba(255,0,40,${0.55 * k})`);
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  }
  // scanlines
  ctx.fillStyle = 'rgba(0,0,0,.12)';
  for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * 0.35})`; ctx.fillRect(0, 0, W, H); }
  drawHUD();
}

let last = performance.now();
function loop(now) {
  let dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (mode === 'crash') dt *= Math.min(1, 0.2 + crashT * 0.9); // slow-mo wipeout
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
